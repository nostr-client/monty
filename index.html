<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>monty — the full nostr client</title>
<meta name="description" content="The full-monty nostr client: everything, composed from independent no-build components.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,12 90,88 10,88' fill='%237c3aed'/></svg>">
<link rel="stylesheet" href="https://nostr-client.github.io/theme/theme.css">
<style>
  body { margin: 0; }
  .app { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: 0;
    max-width: 62rem; margin: 0 auto; min-height: 100vh; }

  /* ---- sidebar */
  aside { border-right: 1px solid var(--nc-line); padding: 1.2rem .9rem;
    display: flex; flex-direction: column; gap: .2rem; position: sticky; top: 0;
    height: 100vh; box-sizing: border-box; }
  .brand { display: flex; align-items: center; gap: .5rem; font-weight: 800;
    font-size: 1.15rem; padding: .4rem .8rem 1rem; color: var(--nc-ink);
    text-decoration: none; }
  .brand .tri { color: var(--nc-accent); }
  aside nav { display: flex; flex-direction: column; gap: .15rem; flex: 1; }
  aside nav button { font: inherit; font-size: .98rem; text-align: left; cursor: pointer;
    border: none; background: none; color: var(--nc-ink); padding: .55em .8em;
    border-radius: 10px; display: flex; gap: .7rem; align-items: center; }
  aside nav button:hover { background: var(--nc-inset); }
  aside nav button.active { background: var(--nc-accent-soft); color: var(--nc-accent);
    font-weight: 700; }
  aside nav button .ico { width: 1.3em; text-align: center; }
  .side-login { padding: .4rem .5rem; }

  /* ---- main */
  main { padding: 0 1.2rem 5rem; }
  .topbar { position: sticky; top: 0; z-index: 5; padding: .9rem .2rem .7rem;
    background: color-mix(in srgb, var(--nc-bg) 90%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--nc-line);
    margin-bottom: 1rem; display: flex; align-items: center; gap: .8rem; }
  .topbar h2 { margin: 0; font-size: 1.05rem; }
  .topbar .back { font: inherit; cursor: pointer; border: none; background: none;
    color: var(--nc-soft); padding: 0; font-size: 1.1rem; }
  .topbar .back:hover { color: var(--nc-ink); }
  .view { display: none; } .view.active { display: block; }
  .seg { display: inline-flex; gap: .2rem; background: var(--nc-inset);
    border-radius: 999px; padding: .2rem; }
  .seg button { font: inherit; font-size: .85rem; cursor: pointer; border: none;
    background: none; color: var(--nc-soft); padding: .3em .9em; border-radius: 999px; }
  .seg button.active { background: var(--nc-surface); color: var(--nc-ink);
    font-weight: 650; box-shadow: var(--nc-shadow); }
  nostr-composer { margin-bottom: 1rem; }
  .quiet { color: var(--nc-soft); padding: 2rem 0; text-align: center; }
  .relay-picker { display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: 1rem; }
  .relay-picker button { font: inherit; font-size: .8rem; cursor: pointer;
    border: 1px solid var(--nc-line); background: var(--nc-surface); color: var(--nc-soft);
    padding: .35em .9em; border-radius: 999px; font-family: var(--nc-mono); }
  .relay-picker button.active { border-color: var(--nc-accent); color: var(--nc-accent);
    background: var(--nc-accent-soft); font-weight: 600; }
  .relay-picker input { font: inherit; font-size: .8rem; font-family: var(--nc-mono);
    border: 1px dashed var(--nc-line); background: transparent; color: inherit;
    padding: .35em .9em; border-radius: 999px; min-width: 14rem; }
  .stack > * + * { margin-top: 1rem; }
  h3.sub { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
    color: var(--nc-soft); margin: 1.6rem 0 .6rem; }
  footer { margin-top: 3rem; font-size: .75rem; color: var(--nc-faint); }
  footer a { color: inherit; }

  /* ---- mobile */
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    aside { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto;
      flex-direction: row; align-items: center; padding: .3rem .5rem;
      border-right: none; border-top: 1px solid var(--nc-line);
      background: var(--nc-bg); z-index: 10; }
    .brand, .side-login, aside nav button .txt { display: none; }
    aside nav { flex-direction: row; justify-content: space-around; width: 100%; }
    aside nav button { font-size: 1.25rem; padding: .45em .6em; }
    main { padding-bottom: 6rem; }
    .mobile-login { display: block !important; }
  }
  .mobile-login { display: none; margin-left: auto; }
</style>
</head>
<body>
<div class="app">
  <aside>
    <a class="brand" href="https://github.com/nostr-client/monty"><span class="tri">▲</span> monty</a>
    <nav id="nav">
      <button data-view="home" class="active"><span class="ico">⌂</span><span class="txt">Home</span></button>
      <button data-view="explore"><span class="ico">◎</span><span class="txt">Explore</span></button>
      <button data-view="search"><span class="ico">⌕</span><span class="txt">Search</span></button>
      <button data-view="mentions"><span class="ico">@</span><span class="txt">Mentions</span></button>
      <button data-view="me"><span class="ico">☺</span><span class="txt">Profile</span></button>
      <button data-view="relays"><span class="ico">⛁</span><span class="txt">Relays</span></button>
    </nav>
    <div class="side-login"><nostr-login></nostr-login></div>
  </aside>

  <main>
    <div class="topbar">
      <button class="back" id="back" hidden>←</button>
      <h2 id="title">Home</h2>
      <span class="seg" id="home-seg">
        <button data-mode="global" class="active">Global</button>
        <button data-mode="following">Following</button>
      </span>
      <span class="mobile-login"><nostr-login></nostr-login></span>
    </div>

    <div class="view active" id="view-home">
      <nostr-composer placeholder="What's happening?"></nostr-composer>
      <div class="quiet" id="home-empty" hidden></div>
      <nostr-feed id="home-feed" limit="30"></nostr-feed>
    </div>

    <div class="view" id="view-explore">
      <div class="relay-picker" id="relay-picker"></div>
      <nostr-feed id="explore-feed" limit="25" relays="wss://nos.lol"></nostr-feed>
    </div>

    <div class="view" id="view-search">
      <nostr-search></nostr-search>
    </div>

    <div class="view" id="view-mentions">
      <nostr-notifications></nostr-notifications>
    </div>

    <div class="view" id="view-me">
      <div class="stack">
        <div class="quiet" id="me-empty">Log in to see your profile.</div>
        <nostr-profile id="me-card" hidden></nostr-profile>
        <div id="me-editor-wrap" hidden>
          <h3 class="sub">Edit profile</h3>
          <nostr-profile-editor></nostr-profile-editor>
          <h3 class="sub">Following</h3>
          <nostr-contacts></nostr-contacts>
        </div>
      </div>
    </div>

    <div class="view" id="view-relays">
      <nostr-relay-manager></nostr-relay-manager>
      <footer id="cache-line"></footer>
    </div>

    <div class="view" id="view-thread">
      <nostr-thread id="thread"></nostr-thread>
    </div>

    <div class="view" id="view-person">
      <div class="stack">
        <nostr-profile id="person-card"></nostr-profile>
        <nostr-feed id="person-feed" limit="20" authors="none"></nostr-feed>
      </div>
    </div>

    <div class="view" id="view-tag">
      <nostr-feed id="tag-feed" limit="25" hashtag="nostr"></nostr-feed>
    </div>

    <footer>
      the full monty, composed from <a href="https://nostr-client.github.io/">nostr-client</a> parts.
      no build · no bundler · verified events · local cache · AGPL.
      calmer grades: <a href="https://nostr-client.github.io/micro/">micro</a> ·
      <a href="https://nostr-client.github.io/zen/">zen</a>
    </footer>
  </main>
</div>

<script type="module">
  // hardened shared pool: verify inside, cache outside — before any component loads
  {
    const { Pool } = await import('https://nostr-client.github.io/pool/pool.js')
    const { withVerify } = await import('https://nostr-client.github.io/verify/verify.js')
    const { withCache } = await import('https://nostr-client.github.io/cache/cache.js')
    globalThis.__nostrClientPool = withCache(withVerify(new Pool()))
  }
  const { applySavedRelays } = await import('https://nostr-client.github.io/relay-manager/relay-manager.js')
  applySavedRelays()

  import('https://nostr-client.github.io/reactions/reactions.js') // note cards grow reaction bars
  import('https://nostr-client.github.io/tip/tip.js')             // profile cards grow ₿ buttons
  await Promise.all([
    'login/login.js', 'composer/composer.js', 'feed/feed.js', 'thread/thread.js',
    'notifications/notifications.js', 'search/search.js', 'contacts/contacts.js',
    'profile/profile.js', 'profile-editor/profile-editor.js',
  ].map((path) => import('https://nostr-client.github.io/' + path)))
  const { parseRefs } = await import('https://nostr-client.github.io/thread/thread.js')
  const { defaultPool } = await import('https://nostr-client.github.io/pool/pool.js')
  const { cacheStats } = await import('https://nostr-client.github.io/cache/cache.js')

  const $ = (id) => document.getElementById(id)
  const HEX = /^[0-9a-f]{64}$/

  // ------------------------------------------------------------- router
  const TITLES = { home: 'Home', explore: 'Explore', search: 'Search', mentions: 'Mentions',
    me: 'Profile', relays: 'Relays', thread: 'Thread', person: 'Profile', tag: 'Hashtag' }
  const tabs = document.querySelectorAll('#nav button')
  let currentTab = 'home'

  function show(view, { push = true, hash = '' } = {}) {
    for (const t of tabs) t.classList.toggle('active', t.dataset.view === view)
    for (const v of document.querySelectorAll('.view')) {
      v.classList.toggle('active', v.id === 'view-' + view)
    }
    $('title').textContent = TITLES[view] ?? view
    $('back').hidden = !['thread', 'person', 'tag'].includes(view)
    $('home-seg').style.display = view === 'home' ? '' : 'none'
    if (push) history.pushState({}, '', hash ? '#' + hash : location.pathname)
    scrollTo(0, 0)
  }

  function route(hash) {
    const [kind, value] = hash.split('/')
    if (kind === 'note' && HEX.test(value)) {
      $('thread').setAttribute('event-id', value)
      show('thread', { push: false })
    } else if (kind === 'person' && HEX.test(value)) {
      $('person-card').setAttribute('pubkey', value)
      $('person-feed').setAttribute('authors', value)
      show('person', { push: false })
    } else if (kind === 'tag' && value) {
      $('tag-feed').setAttribute('hashtag', value)
      $('title').textContent = '#' + value
      show('tag', { push: false })
      $('title').textContent = '#' + decodeURIComponent(value)
    } else {
      show(currentTab, { push: false })
    }
  }

  for (const tab of tabs) {
    tab.onclick = () => { currentTab = tab.dataset.view; show(currentTab) }
  }
  $('back').onclick = () => history.back()
  addEventListener('popstate', () => route(location.hash.slice(1)))

  document.addEventListener('nostr:note-click', (e) => {
    const target = e.detail.targetId ?? parseRefs(e.detail.event).root ?? e.detail.event.id
    $('thread').setAttribute('event-id', target)
    show('thread', { hash: 'note/' + target })
  })
  document.addEventListener('nostr:profile-click', (e) => {
    e.preventDefault() // handle in-app instead of following the link
    $('person-card').setAttribute('pubkey', e.detail.pubkey)
    $('person-feed').setAttribute('authors', e.detail.pubkey)
    show('person', { hash: 'person/' + e.detail.pubkey })
  })
  document.addEventListener('nostr:hashtag-click', (e) => {
    $('tag-feed').setAttribute('hashtag', e.detail.tag)
    show('tag', { hash: 'tag/' + e.detail.tag })
    $('title').textContent = '#' + e.detail.tag
  })
  if (location.hash) route(location.hash.slice(1))

  // ------------------------------------------------------- home: modes
  const homeFeed = $('home-feed')
  const homeEmpty = $('home-empty')
  let mode = 'global'
  let follows = null

  async function setMode(next) {
    mode = next
    for (const b of $('home-seg').children) b.classList.toggle('active', b.dataset.mode === mode)
    if (mode === 'global') {
      homeEmpty.hidden = true; homeFeed.hidden = false
      homeFeed.removeAttribute('authors')
      return
    }
    if (!window.nostrPubkey) {
      homeEmpty.textContent = 'Log in to see notes from people you follow.'
      homeEmpty.hidden = false; homeFeed.hidden = true
      return
    }
    if (!follows) {
      const contacts = await defaultPool().get({ kinds: [3], authors: [window.nostrPubkey] })
      follows = (contacts?.tags ?? [])
        .filter((t) => t[0] === 'p' && HEX.test(t[1] ?? '')).map((t) => t[1])
    }
    if (follows.length) {
      homeEmpty.hidden = true; homeFeed.hidden = false
      homeFeed.setAttribute('authors', follows.slice(0, 500).join(','))
    } else {
      homeEmpty.textContent = 'No follows yet — explore and follow someone.'
      homeEmpty.hidden = false; homeFeed.hidden = true
    }
  }
  for (const b of $('home-seg').children) b.onclick = () => setMode(b.dataset.mode)
  window.addEventListener('nostr:contacts-changed', () => { follows = null; if (mode === 'following') setMode(mode) })

  // ------------------------------------------------------ explore relays
  const EXPLORE_RELAYS = [
    'wss://nos.lol', 'wss://relay.damus.io', 'wss://relay.nostr.band',
    'wss://nostr.wine', 'wss://relay.snort.social', 'wss://nostr.mom',
  ]
  const picker = $('relay-picker')
  function pickRelay(url) {
    $('explore-feed').setAttribute('relays', url)
    for (const b of picker.querySelectorAll('button')) {
      b.classList.toggle('active', b.dataset.url === url)
    }
  }
  for (const url of EXPLORE_RELAYS) {
    const b = document.createElement('button')
    b.dataset.url = url
    b.textContent = url.replace('wss://', '')
    b.onclick = () => pickRelay(url)
    picker.append(b)
  }
  const custom = document.createElement('input')
  custom.placeholder = 'wss://your.relay…'
  custom.onchange = () => { try { pickRelay(new URL(custom.value).href.replace(/\/$/, '')) } catch {} }
  picker.append(custom)
  pickRelay(EXPLORE_RELAYS[0])

  // ------------------------------------------------------------- me view
  function refreshMe() {
    const me = window.nostrPubkey
    $('me-empty').hidden = !!me
    $('me-card').hidden = !me
    $('me-editor-wrap').hidden = !me
    if (me) $('me-card').setAttribute('pubkey', me)
  }
  window.addEventListener('nostr:login', () => { follows = null; refreshMe(); if (mode === 'following') setMode(mode) })
  window.addEventListener('nostr:logout', () => { follows = null; refreshMe(); if (mode === 'following') setMode(mode) })
  refreshMe()

  // --------------------------------------------------------- cache stats
  async function cacheLine() {
    try {
      const { events, replaceable } = await cacheStats()
      $('cache-line').textContent = `local cache: ${events} events · ${replaceable} profiles/lists — all verified before storage`
    } catch {}
  }
  cacheLine()
  setInterval(cacheLine, 5000)
</script>
</body>
</html>
